<script>
(function() {
  const shell = document.querySelector(".plot-shell");
  if (!shell) return;

  function fitPlot() {
    shell.style.transform = "none";
    const viewportWidth = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
    const naturalWidth = shell.scrollWidth;
    if (!viewportWidth || !naturalWidth) return;
    const scale = Math.min(1, viewportWidth / naturalWidth);
    shell.style.transform = `scale(${scale})`;
  }

  function scheduleFit() {
    requestAnimationFrame(() => requestAnimationFrame(fitPlot));
  }

  window.addEventListener("load", scheduleFit);
  window.addEventListener("resize", scheduleFit);

  const observer = new MutationObserver(scheduleFit);
  observer.observe(shell, { childList: true, subtree: true, attributes: true });

  setTimeout(scheduleFit, 50);
  setTimeout(scheduleFit, 250);
})();
</script>
