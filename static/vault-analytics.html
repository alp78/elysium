<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elysium — Vault Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{--light:#1a1b26;--lightgray:#24283b;--gray:#565f89;--darkgray:#a9b1d6;--dark:#c0caf5;--secondary:#7aa2f7;--tertiary:#bb9af7;--bodyFont:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--light);color:var(--darkgray);font-family:var(--bodyFont);margin:0;padding:1rem 2rem;max-width:1200px;margin:0 auto}
h2,h3,h4{color:var(--dark)}
a{color:var(--secondary);text-decoration:none}a:hover{text-decoration:underline}
.back-link{margin-bottom:1rem;display:block;font-size:0.9rem}
.vd-scorecard{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin:1.5rem 0}
.vd-card{background:var(--lightgray);border-radius:8px;padding:1rem;text-align:center}
.vd-card-value{font-size:1.8rem;font-weight:700;color:var(--secondary)}
.vd-card-label{font-size:.75rem;color:var(--gray);text-transform:uppercase;letter-spacing:.05em;margin-top:.25rem}
.vd-chart-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1.5rem 0}
.vd-chart-half{min-height:320px}
.vd-chart-half h3,.vd-section h3,.vd-section h4{color:var(--dark);margin-bottom:.5rem;font-size:1rem}
.vd-section{margin:1.5rem 0}
.vd-filter-bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.75rem}
.vd-search{flex:1;min-width:200px;padding:.5rem .75rem;border:1px solid var(--lightgray);border-radius:6px;background:var(--light);color:var(--darkgray);font-size:.85rem}
.vd-btn{padding:.4rem .75rem;border:1px solid var(--lightgray);border-radius:6px;background:transparent;color:var(--secondary);cursor:pointer;font-size:.8rem}
.vd-btn:hover{background:var(--secondary);color:var(--light)}
.vd-active-filters{display:flex;gap:.4rem;flex-wrap:wrap;min-height:1.5rem}
.vd-chip{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:12px;background:var(--secondary);color:#fff;font-size:.75rem;cursor:pointer}
.vd-chip-x{font-weight:700;margin-left:.2rem}
.vd-count{color:var(--gray);font-size:.8rem;margin:.5rem 0}
.vd-table-wrap{overflow-x:auto;margin:.5rem 0}
.vd-table{width:100%;border-collapse:collapse;font-size:.8rem}
.vd-table th{text-align:left;padding:.5rem;border-bottom:2px solid var(--lightgray);color:var(--gray);font-weight:600;font-size:.7rem;text-transform:uppercase;cursor:pointer}
.vd-table td{padding:.4rem .5rem;border-bottom:1px solid var(--lightgray);color:var(--darkgray)}
.vd-table a{color:var(--secondary);text-decoration:none}.vd-table a:hover{text-decoration:underline}
.vd-type-badge{display:inline-block;padding:.1rem .4rem;border-radius:4px;color:#fff;font-size:.7rem;font-weight:600}
.vd-tag-pill{display:inline-block;padding:.1rem .35rem;border-radius:3px;background:var(--lightgray);color:var(--darkgray);font-size:.65rem;cursor:pointer;margin:.1rem}
.vd-tag-pill:hover{background:var(--secondary);color:#fff}
.vd-clickable{cursor:pointer}.vd-clickable:hover{color:var(--secondary)}
.vd-insights-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin:1.5rem 0}
.vd-insight-panel{background:var(--lightgray);border-radius:8px;padding:1rem}
.vd-insight-panel h4{margin:0 0 .5rem;font-size:.85rem;color:var(--dark)}
.vd-insight-list{list-style:none;padding:0;margin:0}
.vd-insight-list li{padding:.25rem 0;font-size:.8rem;border-bottom:1px solid rgba(128,128,128,.1)}
.vd-insight-list a{color:var(--secondary);text-decoration:none}
.vd-insight-list small{color:var(--gray);margin-left:.3rem}
.vd-mini-bar{height:4px;background:rgba(128,128,128,.15);border-radius:2px;margin-top:.2rem}
.vd-mini-bar div{height:100%;background:var(--secondary);border-radius:2px}
.vd-heatmap{width:100%;border-collapse:collapse;font-size:.7rem;margin-top:.5rem}
.vd-heatmap th,.vd-heatmap td{padding:.3rem .4rem;border:1px solid var(--lightgray)}
.vd-heatmap th{background:var(--lightgray);color:var(--gray);font-weight:600;text-transform:uppercase;font-size:.6rem}
@media(max-width:768px){.vd-scorecard{grid-template-columns:repeat(2,1fr)}.vd-chart-row{grid-template-columns:1fr}.vd-insights-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="back-link" href="/elysium/00-Home/Dashboard">&larr; Back to Dashboard</a>
<h2>Vault Analytics</h2>
<div id="vault-dashboard"><p style="text-align:center;padding:2rem;color:var(--gray);">Loading vault data...</p></div>

<script>
(function(){
const BASE='/elysium';
const MANIFEST_URL=BASE+'/static/vault-manifest.json';
const COLORS=['#32CD32','#FF8C00','#3381FF','#800080','#00CC00','#82A3FF','#FFA500','#1E90FF','#FFD700','#FFFF00','#FF00FF','#FF0096','#00FFFF','#FF0000','#999999','#CC6600','#66CCFF','#ffffff'];
const TYPE_COLORS={reference:'#3381FF',concept:'#00CC00','how-to':'#FF8C00',runbook:'#FF0000',troubleshooting:'#FF0096',index:'#999999',adr:'#800080','cheat-sheet':'#FFD700',comparison:'#00FFFF',moc:'#82A3FF',unknown:'#666'};
let allNotes=[],manifest=null,filters={section:null,type:null,tags:[],search:''};

async function init(){
  try{
    const r=await fetch(MANIFEST_URL);
    if(!r.ok)throw new Error('HTTP '+r.status);
    manifest=await r.json();
    allNotes=manifest.notes||[];
    render();
  }catch(e){
    document.getElementById('vault-dashboard').innerHTML='<p style="color:#ff6666;text-align:center;padding:2rem;">Error loading vault data: '+e.message+'</p>';
  }
}

function fmt(n){return n>=1000?(n/1000).toFixed(0)+'K':n.toString();}
function el(tag,cls,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(parent)parent.appendChild(e);return e;}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function render(){
  const d=document.getElementById('vault-dashboard');d.innerHTML='';
  renderScorecard(d);renderCharts(d);renderTagCloud(d);renderBrowser(d);renderInsights(d);renderHeatmap(d);
  applyFilters();
}

function renderScorecard(p){
  const stats=[{v:manifest.total_notes,l:'Notes'},{v:fmt(manifest.total_words),l:'Words'},{v:manifest.sections_list.length,l:'Sections'},{v:Object.keys(manifest.tag_frequency).length,l:'Tags'},{v:manifest.avg_word_count,l:'Avg Words'},{v:manifest.notes_with_code_pct+'%',l:'Have Code'},{v:manifest.notes_with_related_pct+'%',l:'Have Related'},{v:manifest.avg_outgoing_links,l:'Avg Links'}];
  const g=el('div','vd-scorecard',p);
  stats.forEach(s=>{const c=el('div','vd-card',g);el('div','vd-card-value',c).textContent=s.v;el('div','vd-card-label',c).textContent=s.l;});
}

function renderCharts(p){
  const row=el('div','vd-chart-row',p);
  const bc=el('div','vd-chart-half',row);el('h3','',bc).textContent='Notes by Section';
  const c1=el('canvas','',bc);c1.height=300;
  const dc=el('div','vd-chart-half',row);el('h3','',dc).textContent='Notes by Type';
  const c2=el('canvas','',dc);c2.height=300;
  requestAnimationFrame(()=>{
    const sl=manifest.sections_list.sort((a,b)=>b.note_count-a.note_count);
    new Chart(c1,{type:'bar',data:{labels:sl.map(s=>s.name),datasets:[{data:sl.map(s=>s.note_count),backgroundColor:sl.map((_,i)=>COLORS[i%COLORS.length]),borderWidth:0}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,animation:{duration:600},plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.raw+' notes'}}},scales:{x:{grid:{color:'rgba(128,128,128,.15)'},ticks:{color:'#a9b1d6'}},y:{grid:{display:false},ticks:{color:'#a9b1d6',font:{size:11}}}},onClick:(_,els)=>{if(els.length){filters.section=sl[els[0].index].slug;applyFilters();}}}});
    const types=Object.entries(manifest.notes_by_type);
    new Chart(c2,{type:'doughnut',data:{labels:types.map(t=>t[0]),datasets:[{data:types.map(t=>t[1]),backgroundColor:types.map(t=>TYPE_COLORS[t[0]]||'#666'),borderWidth:1,borderColor:'rgba(0,0,0,.2)'}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:600},plugins:{legend:{position:'bottom',labels:{color:'#a9b1d6',font:{size:11}}},tooltip:{callbacks:{label:ctx=>{const pct=Math.round(ctx.raw/manifest.total_notes*100);return ctx.label+': '+ctx.raw+' ('+pct+'%)';}}}},onClick:(_,els)=>{if(els.length){filters.type=types[els[0].index][0];applyFilters();}}}});
  });
}

function renderTagCloud(p){
  const w=el('div','vd-section',p);el('h3','',w).textContent='Top 30 Tags';
  const c=el('canvas','',w);c.height=250;
  requestAnimationFrame(()=>{
    const tags=Object.entries(manifest.tag_frequency).slice(0,30);const mx=tags[0]?tags[0][1]:1;
    new Chart(c,{type:'bar',data:{labels:tags.map(t=>t[0]),datasets:[{data:tags.map(t=>t[1]),backgroundColor:tags.map(t=>{const a=.3+.7*(t[1]/mx);return'rgba(122,162,247,'+a+')';}),borderWidth:0}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,animation:{duration:600},plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(128,128,128,.15)'},ticks:{color:'#a9b1d6'}},y:{grid:{display:false},ticks:{color:'#a9b1d6',font:{size:10}}}}},onClick:(_,els)=>{if(els.length){const t=tags[els[0].index][0];if(!filters.tags.includes(t))filters.tags.push(t);applyFilters();}}});
  });
}

function renderBrowser(p){
  const w=el('div','vd-section',p);w.id='vd-browser';
  const fb=el('div','vd-filter-bar',w);
  const si=document.createElement('input');si.type='text';si.placeholder='Search notes...';si.className='vd-search';
  let db;si.addEventListener('input',()=>{clearTimeout(db);db=setTimeout(()=>{filters.search=si.value;applyFilters();},200);});
  fb.appendChild(si);
  const cb=el('button','vd-btn',fb);cb.textContent='Clear All';cb.onclick=()=>{filters={section:null,type:null,tags:[],search:''};si.value='';applyFilters();};
  el('div','vd-active-filters',w).id='vd-active-filters';
  el('div','vd-count',w).id='vd-count';
  const tw=el('div','vd-table-wrap',w);
  const tbl=document.createElement('table');tbl.className='vd-table';tbl.id='vd-table';
  tbl.innerHTML='<thead><tr><th data-sort="title">Title</th><th data-sort="section">Section</th><th data-sort="type">Type</th><th>Tags</th><th data-sort="word_count">Words</th><th data-sort="updated">Updated</th></tr></thead><tbody></tbody>';
  tw.appendChild(tbl);
  let sortCol='section_number',sortAsc=true;
  tbl.querySelectorAll('th[data-sort]').forEach(th=>{th.onclick=()=>{const c=th.dataset.sort;if(sortCol===c)sortAsc=!sortAsc;else{sortCol=c;sortAsc=true;}applyFilters(sortCol,sortAsc);};});
}

function applyFilters(sortCol='section_number',sortAsc=true){
  let notes=allNotes.filter(n=>{
    if(filters.section&&n.section!==filters.section)return false;
    if(filters.type&&n.type!==filters.type)return false;
    if(filters.search&&!n.title.toLowerCase().includes(filters.search.toLowerCase())&&!n.filename.toLowerCase().includes(filters.search.toLowerCase()))return false;
    if(filters.tags.length&&!filters.tags.every(t=>n.tags.includes(t)))return false;
    return true;
  });
  notes.sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(typeof va==='string')va=va.toLowerCase();if(typeof vb==='string')vb=vb.toLowerCase();if(va<vb)return sortAsc?-1:1;if(va>vb)return sortAsc?1:-1;return 0;});
  const af=document.getElementById('vd-active-filters');
  if(af){af.innerHTML='';
    if(filters.section){const ch=el('span','vd-chip',af);ch.innerHTML='Section: '+filters.section+' <span class="vd-chip-x">&times;</span>';ch.onclick=()=>{filters.section=null;applyFilters();};}
    if(filters.type){const ch=el('span','vd-chip',af);ch.innerHTML='Type: '+filters.type+' <span class="vd-chip-x">&times;</span>';ch.onclick=()=>{filters.type=null;applyFilters();};}
    filters.tags.forEach((t,i)=>{const ch=el('span','vd-chip',af);ch.innerHTML='Tag: '+t+' <span class="vd-chip-x">&times;</span>';ch.onclick=()=>{filters.tags.splice(i,1);applyFilters();};});}
  const cnt=document.getElementById('vd-count');if(cnt)cnt.textContent='Showing '+notes.length+' of '+allNotes.length+' notes';
  const tbody=document.querySelector('#vd-table tbody');if(!tbody)return;tbody.innerHTML='';
  notes.forEach(n=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td><a href="'+n.url+'">'+esc(n.title)+'</a></td><td class="vd-clickable" data-section="'+n.section+'">'+esc(n.section_name)+'</td><td><span class="vd-type-badge" style="background:'+(TYPE_COLORS[n.type]||'#666')+'">'+esc(n.type)+'</span></td><td>'+n.tags.slice(0,4).map(t=>'<span class="vd-tag-pill" data-tag="'+esc(t)+'">'+esc(t)+'</span>').join(' ')+'</td><td>'+n.word_count+'</td><td>'+esc(n.updated||'—')+'</td>';
    tbody.appendChild(tr);});
  tbody.querySelectorAll('.vd-clickable').forEach(td=>{td.onclick=()=>{filters.section=td.dataset.section;applyFilters();};});
  tbody.querySelectorAll('.vd-tag-pill').forEach(sp=>{sp.onclick=()=>{const t=sp.dataset.tag;if(!filters.tags.includes(t))filters.tags.push(t);applyFilters();};});
}

function renderInsights(p){
  const row=el('div','vd-insights-row',p);
  const p1=el('div','vd-insight-panel',row);el('h4','',p1).textContent='Recently Updated';
  const ul1=el('ul','vd-insight-list',p1);
  (manifest.recently_updated||[]).forEach(n=>{const li=el('li','',ul1);li.innerHTML='<a href="'+n.url+'">'+esc(n.title)+'</a> <small>'+esc(n.updated)+'</small>';});
  const p2=el('div','vd-insight-panel',row);el('h4','',p2).textContent='Largest Notes';
  const ul2=el('ul','vd-insight-list',p2);const maxW=manifest.largest_notes[0]?manifest.largest_notes[0].word_count:1;
  (manifest.largest_notes||[]).forEach(n=>{const li=el('li','',ul2);const pct=Math.round(n.word_count/maxW*100);li.innerHTML='<a href="'+n.url+'">'+esc(n.title)+'</a> <small>'+n.word_count+' words</small><div class="vd-mini-bar"><div style="width:'+pct+'%"></div></div>';});
  const p3=el('div','vd-insight-panel',row);el('h4','',p3).textContent='Most Connected';
  const ul3=el('ul','vd-insight-list',p3);
  (manifest.most_connected||[]).forEach(n=>{const li=el('li','',ul3);li.innerHTML='<a href="'+n.url+'">'+esc(n.title)+'</a> <small>'+n.outgoing_links+' links</small>';});
}

function renderHeatmap(p){
  const w=el('div','vd-section',p);el('h3','',w).textContent='Section x Type Coverage';
  const types=Object.keys(manifest.notes_by_type);const sections=manifest.sections_list;
  const tbl=document.createElement('table');tbl.className='vd-heatmap';
  let hdr='<tr><th></th>';types.forEach(t=>{hdr+='<th>'+t+'</th>';});hdr+='</tr>';
  let body='';const mx=Math.max(...sections.flatMap(s=>types.map(t=>allNotes.filter(n=>n.section===s.slug&&n.type===t).length)),1);
  sections.forEach(s=>{body+='<tr><td>'+esc(s.name)+'</td>';types.forEach(t=>{const c=allNotes.filter(n=>n.section===s.slug&&n.type===t).length;const op=c===0?0:.2+.8*(c/mx);body+='<td style="background:rgba(122,162,247,'+op+');text-align:center;color:'+(op>.5?'#fff':'#a9b1d6')+'">'+c+'</td>';});body+='</tr>';});
  tbl.innerHTML='<thead>'+hdr+'</thead><tbody>'+body+'</tbody>';w.appendChild(tbl);
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
